<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>html { scrollbar-gutter: stable; }</style>
    <link rel="modulepreload" href="/page-entry.js?v=20260917-feedback" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <title>玩家论坛 | Liou_Yang Server</title>
    <link rel="stylesheet" href="/styles.css?v=20260918-search-polish" />
    <link rel="stylesheet" href="/ui-components.css?v=20260917-feedback" />
  </head>
  <body data-page="forum">
    <header class="site-header">
      <a class="brand" href="/index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Liou_Yang Server</span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a href="/index.html">首页</a>
        <a href="/index.html#announcements">公告</a>
        <a href="/forum.html" class="active">论坛</a>
        <a href="/admin.html" data-admin-link hidden>后台</a>
      </nav>
      <div class="auth-actions" id="authActions"></div>
    </header>

    <section class="maintenance-gate" id="maintenanceGate" hidden>
      <div class="maintenance-card">
        <h1>网站维护中</h1>
        <p id="maintenanceGateDescription">&#32593;&#31449;&#27491;&#22312;&#32500;&#25252;&#20013;&#65292;&#35831;&#31245;&#21518;&#20877;&#26469;&#12290;</p>
        <div id="maintenanceGateBody"></div>
      </div>
    </section>

    <main>
      <section class="page-hero forum-hero">
        <h1>论坛</h1>
      </section>

      <section class="forum-controls">
        <aside class="profile-card" id="profileCard"></aside>
        <div class="forum-main">
          <div class="forum-toolbar">
            <div class="section-title compact">
              <h2>最新帖子</h2>
            </div>
            <div class="forum-toolbar-actions">
              <button
                class="forum-search-toggle"
                type="button"
                id="forumSearchToggle"
                aria-controls="forumSearchPanel"
                aria-expanded="false"
                aria-label="搜索论坛帖子"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="6.5"></circle>
                  <path d="M16.2 16.2 21 21"></path>
                </svg>
              </button>
              <div class="forum-search-panel" id="forumSearchPanel" hidden>
                <div class="forum-search-box">
                  <input
                    id="forumSearchInput"
                    type="search"
                    autocomplete="off"
                    placeholder="搜索标题、内容、发布者"
                    aria-label="搜索论坛帖子"
                  />
                  <button class="forum-search-clear" type="button" id="forumSearchClear" aria-label="清空搜索">×</button>
                </div>
                <span
                  class="forum-search-tip"
                  title="支持标题、内容和发布者搜索。输入 #发布者名 可以直接按发布者筛选，例如 #Steve。"
                  aria-label="搜索提示"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 10v6"></path>
                    <path d="M12 7.25h.01"></path>
                  </svg>
                </span>
                <div class="forum-search-status" id="forumSearchStatus"></div>
              </div>
              <button class="button primary" type="button" id="openPostComposer" aria-label="发布新帖">+ 发帖</button>
            </div>
          </div>
          <div class="list forum-list" id="postList" aria-busy="true">
            <div class="content-skeleton" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <dialog id="postDialog" class="compose-dialog">
      <h2>发布新帖</h2>
      <form id="forumPostForm">
        <div class="form-row">
          <label for="forumTitle">标题</label>
          <input id="forumTitle" maxlength="80" required placeholder="例如：我的新基地完工了" />
        </div>
        <div class="editor-toolbar-shell">
          <div class="toolbar editor-toolbar" aria-label="编辑工具栏">
            <button type="button" data-command="bold" title="粗体"><strong>B</strong></button>
            <button type="button" data-command="italic" title="斜体"><em>I</em></button>
            <button type="button" data-command="underline" title="下划线"><u>U</u></button>
            <button type="button" data-command="strikeThrough" title="中划线"><s>S</s></button>
            <select id="fontSizeSelect" class="toolbar-select" title="字号">
              <option value="">字号</option>
              <option value="3">正文</option>
              <option value="4">大号</option>
              <option value="5">标题</option>
              <option value="6">特大</option>
            </select>
            <select id="blockFormatSelect" class="toolbar-select" title="段落格式">
              <option value="">段落</option>
              <option value="P">正文</option>
              <option value="H2">标题 2</option>
              <option value="H3">标题 3</option>
              <option value="BLOCKQUOTE">引用</option>
              <option value="PRE">代码块</option>
            </select>
            <select id="alignSelect" class="toolbar-select" title="对齐方式">
              <option value="">对齐</option>
              <option value="justifyLeft">居左</option>
              <option value="justifyCenter">居中</option>
              <option value="justifyRight">居右</option>
            </select>
            <button type="button" id="linkButton" title="添加链接">链接</button>
            <button type="button" id="imageButton" title="插入图片">图片</button>
            <button type="button" id="findReplaceButton" title="查找和替换">查找</button>
            <button type="button" id="tableButton" title="插入表格">表格</button>
            <button type="button" id="spoilerButton" title="内联遮挡">遮挡</button>
            <button type="button" id="hrButton" title="插入水平线">分隔</button>
            <button type="button" id="detailsButton" title="折叠">折叠</button>
            <button type="button" id="codeButton" title="代码">代码</button>
            <button type="button" id="bilibiliButton" title="插入 Bilibili 视频">Bilibili</button>
            <div class="toolbar-more">
              <button class="fui-popover-trigger" type="button" id="moreButton" aria-haspopup="menu" aria-controls="moreMenu" aria-expanded="false" title="更多编辑工具">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
                <span class="sr-only">更多编辑工具</span>
              </button>
              <div class="toolbar-more-menu fui-popover-menu" id="moreMenu" role="menu" aria-label="更多编辑工具" hidden>
                <div class="fui-popover-group" role="group" aria-label="列表">
                  <button class="fui-menu-item" type="button" role="menuitem" data-command="insertUnorderedList"><svg class="fui-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg><span>无序列表</span></button>
                  <button class="fui-menu-item" type="button" role="menuitem" data-command="insertOrderedList"><svg class="fui-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 6h1V3M4 10h2l-2 2h2M4 17h2l-2 2h2"/></svg><span>有序列表</span></button>
                </div>
                <div class="fui-popover-divider" role="separator"></div>
                <div class="fui-popover-group" role="group" aria-label="格式">
                  <button class="fui-menu-item" type="button" role="menuitem" id="colorButton"><svg class="fui-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0-10-10c0 4.42 3.58 8 8 8h1.5a2.5 2.5 0 0 0 0-5H10a2 2 0 0 1-2-2c0-.73.4-1.42 1.04-1.77l1.92-1.06A4 4 0 0 0 13 6.67V2"/><path d="M6.5 8.5h.01M17.5 8.5h.01M16 13h.01"/></svg><span>文本颜色</span></button>
                  <button class="fui-menu-item" type="button" role="menuitem" id="quoteButton"><svg class="fui-menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21c3 0 7-1 7-8V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2c0 3-1 4-3 4v4ZM15 21c3 0 7-1 7-8V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2c0 3-1 4-3 4v4Z"/></svg><span>引用</span></button>
                </div>
              </div>
            </div>
            <span class="toolbar-spacer" aria-hidden="true"></span>
            <button type="button" id="previewButton" class="toolbar-preview-button">预览</button>
          </div>
        </div>
        <div class="rich-editor" id="editor" contenteditable="true" role="textbox" aria-label="帖子正文"></div>
        <button class="button primary submit-button" id="forumPostSubmit" type="submit">发布帖子</button>
      </form>
    </dialog>

    <dialog id="readerDialog">
      <article id="readerContent"></article>
    </dialog>

    <dialog id="previewDialog" class="preview-dialog">
      <button class="dialog-close-button" type="button" data-dialog-close aria-label="关闭预览">×</button>
      <article id="previewContent"></article>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/page-entry.js?v=20260917-feedback" type="module"></script>
  </body>
</html>
