<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="modulepreload" href="/app.js" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <title>玩家论坛 | Liou_Yang Server</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="forum">
    <header class="site-header">
      <a class="brand" href="/index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Liou_Yang Server</span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a href="/index.html">首页</a>
        <a href="/index.html#announcements">公告</a>
        <a href="/forum.html" class="active">论坛</a>
        <a href="/admin.html" data-admin-link hidden>后台</a>
      </nav>
      <div class="auth-actions" id="authActions"></div>
    </header>

    <section class="maintenance-gate" id="maintenanceGate" hidden>
      <div class="maintenance-card">
        <h1>网站维护中</h1>
        <p id="maintenanceGateDescription">&#32593;&#31449;&#27491;&#22312;&#32500;&#25252;&#20013;&#65292;&#35831;&#31245;&#21518;&#20877;&#26469;&#12290;</p>
        <div id="maintenanceGateBody"></div>
      </div>
    </section>

    <main>
      <section class="page-hero forum-hero">
        <h1>论坛</h1>
      </section>

      <section class="forum-controls">
        <aside class="profile-card" id="profileCard"></aside>
        <div class="forum-main">
          <div class="forum-toolbar">
            <div class="section-title compact">
              <h2>最新帖子</h2>
            </div>
            <div class="forum-toolbar-actions">
              <button
                class="forum-search-toggle"
                type="button"
                id="forumSearchToggle"
                aria-controls="forumSearchPanel"
                aria-expanded="false"
                aria-label="搜索论坛帖子"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="6.5"></circle>
                  <path d="M16.2 16.2 21 21"></path>
                </svg>
              </button>
              <div class="forum-search-panel" id="forumSearchPanel" hidden>
                <div class="forum-search-box">
                  <input
                    id="forumSearchInput"
                    type="search"
                    autocomplete="off"
                    placeholder="搜索标题、内容、发布者"
                    aria-label="搜索论坛帖子"
                  />
                  <button class="forum-search-clear" type="button" id="forumSearchClear" aria-label="清空搜索">×</button>
                </div>
                <span
                  class="forum-search-tip"
                  title="支持标题、内容和发布者搜索。输入 #发布者名 可以直接按发布者筛选，例如 #Steve。"
                  aria-label="搜索提示"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 10v6"></path>
                    <path d="M12 7.25h.01"></path>
                  </svg>
                </span>
                <div class="forum-search-status" id="forumSearchStatus"></div>
              </div>
              <button class="button primary" type="button" id="openPostComposer" aria-label="发布新帖">+ 发帖</button>
            </div>
          </div>
          <div class="list forum-list" id="postList"></div>
        </div>
      </section>
    </main>

    <dialog id="postDialog" class="compose-dialog">
      <h2>发布新帖</h2>
      <form id="forumPostForm">
        <div class="form-row">
          <label for="forumTitle">标题</label>
          <input id="forumTitle" maxlength="80" required placeholder="例如：我的新基地完工了" />
        </div>
        <div class="editor-toolbar-shell">
          <div class="toolbar editor-toolbar editor-toolbar--reimagined" aria-label="编辑工具栏">
            <div class="toolbar-group toolbar-group--format" aria-label="文字样式">
              <button type="button" class="toolbar-icon-button" data-command="bold" data-toolbar-label="粗体" title="粗体" aria-label="粗体"><strong>B</strong></button>
              <button type="button" class="toolbar-icon-button" data-command="italic" data-toolbar-label="斜体" title="斜体" aria-label="斜体"><em>I</em></button>
              <button type="button" class="toolbar-icon-button" data-command="underline" data-toolbar-label="下划线" title="下划线" aria-label="下划线"><u>U</u></button>
              <button type="button" class="toolbar-icon-button" data-command="strikeThrough" data-toolbar-label="中划线" title="中划线" aria-label="中划线"><s>S</s></button>
            </div>

            <div class="toolbar-divider" aria-hidden="true"></div>

            <div class="toolbar-group toolbar-group--structure" aria-label="段落结构">
              <select id="fontSizeSelect" class="toolbar-select" title="字号" aria-label="字号">
                <option value="">字号</option>
                <option value="3">正文</option>
                <option value="4">大号</option>
                <option value="5">标题</option>
                <option value="6">特大</option>
              </select>
              <select id="blockFormatSelect" class="toolbar-select" title="段落格式" aria-label="段落格式">
                <option value="">段落</option>
                <option value="P">正文</option>
                <option value="H2">标题 2</option>
                <option value="H3">标题 3</option>
                <option value="BLOCKQUOTE">引用</option>
                <option value="PRE">代码块</option>
              </select>
              <select id="alignSelect" class="toolbar-select" title="对齐方式" aria-label="对齐方式">
                <option value="">对齐</option>
                <option value="justifyLeft">居左</option>
                <option value="justifyCenter">居中</option>
                <option value="justifyRight">居右</option>
              </select>
            </div>

            <div class="toolbar-divider" aria-hidden="true"></div>

            <div class="toolbar-group toolbar-group--insert" aria-label="插入内容">
              <button type="button" class="toolbar-icon-button" id="linkButton" data-toolbar-label="链接" title="添加链接" aria-label="添加链接">链</button>
              <button type="button" class="toolbar-icon-button" id="imageButton" data-toolbar-label="图片" title="插入图片" aria-label="插入图片">图</button>
              <button type="button" class="toolbar-icon-button" id="tableButton" data-toolbar-label="表格" title="插入表格" aria-label="插入表格">格</button>
            </div>

            <div class="toolbar-group toolbar-group--more toolbar-more" aria-label="更多编辑操作">
              <button type="button" id="moreButton" class="toolbar-icon-button" data-toolbar-label="更多" aria-expanded="false" title="更多" aria-label="更多">⋯</button>
              <div class="toolbar-more-menu" id="moreMenu" hidden>
                <button type="button" data-command="insertUnorderedList" data-toolbar-label="无序列表" title="无序列表" aria-label="无序列表">无序列表</button>
                <button type="button" data-command="insertOrderedList" data-toolbar-label="有序列表" title="有序列表" aria-label="有序列表">有序列表</button>
                <button type="button" id="colorButton" data-toolbar-label="文本颜色" title="文本颜色" aria-label="文本颜色">色</button>
                <button type="button" id="quoteButton" data-toolbar-label="引用" title="引用" aria-label="引用">引用</button>
                <button type="button" id="findReplaceButton" data-toolbar-label="查找" title="查找和替换" aria-label="查找和替换">查找</button>
                <button type="button" id="spoilerButton" data-toolbar-label="遮挡" title="内联遮挡" aria-label="内联遮挡">遮挡</button>
                <button type="button" id="hrButton" data-toolbar-label="分隔" title="插入水平线" aria-label="插入水平线">分隔</button>
                <button type="button" id="detailsButton" data-toolbar-label="折叠" title="折叠" aria-label="折叠">折叠</button>
                <button type="button" id="codeButton" data-toolbar-label="代码" title="代码" aria-label="代码">代码</button>
                <button type="button" id="bilibiliButton" data-toolbar-label="Bilibili" title="插入 Bilibili 视频" aria-label="插入 Bilibili 视频">Bilibili</button>
              </div>
            </div>

            <span class="toolbar-spacer" aria-hidden="true"></span>
            <button type="button" id="previewButton" class="toolbar-preview-button" data-toolbar-label="预览" title="预览" aria-label="预览">预览</button>
          </div>
        </div>
        <div class="rich-editor" id="editor" contenteditable="true" role="textbox" aria-label="帖子正文"></div>
        <button class="button primary submit-button" id="forumPostSubmit" type="submit">发布帖子</button>
      </form>
    </dialog>

    <dialog id="readerDialog">
      <article id="readerContent"></article>
    </dialog>

    <dialog id="previewDialog" class="preview-dialog">
      <button class="dialog-close-button" type="button" data-dialog-close aria-label="关闭预览">×</button>
      <article id="previewContent"></article>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
